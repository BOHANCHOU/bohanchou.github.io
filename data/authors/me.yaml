bio: |
  Bohan Zhou is a PhD candidate in Ecology at the School of Resources and
  Environmental Engineering, Anhui University. His research focuses on aquatic
  ecology and zooplankton community ecology, particularly how inter-basin water
  diversion, hydrological disturbance, and environmental change reshape
  community structure, biodiversity, assembly processes, and ecological network
  stability.

